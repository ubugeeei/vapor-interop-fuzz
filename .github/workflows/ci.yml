name: ci

on:
  push:
    branches: [main]
  pull_request:

# The fuzzer itself is nondeterministic; this workflow is not. It runs the
# deterministic parts (types, lint, unit tests, licence policy) plus one fixed
# seed against the in-repo target, so a regression in the harness fails the PR
# that caused it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job ids double as the required status check names on `main`, so keep them
  # short and stable: renaming one silently drops the branch protection rule.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `setup-vp` installs Vite+, the Node version from `.node-version` and
      # the package manager, and caches the pnpm store.
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          # Installed explicitly below so CI fails on a stale lockfile.
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Format, lint and type-check in one pass. TypeScript 7 (`tsgo`) does the
      # type checking; no build step exists because every runtime file is
      # executed directly by Node 26 type stripping.
      - name: Check
        run: vp check

      - name: Unit tests
        run: vp test

      - name: Licence policy
        run: vp run targets:licenses

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `setup-vp` installs Vite+, the Node version from `.node-version` and
      # the package manager, and caches the pnpm store.
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          # Installed explicitly below so CI fails on a stale lockfile.
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Install Chromium
        run: vp run browsers:install

      # `interop-zoo` needs no submodule, no network and no backend, so this is
      # the one fuzz run that is always reproducible. A fixed seed makes a new
      # finding here a real signal rather than luck.
      - name: Fuzz
        run: vp run fuzz -- --target interop-zoo --seed 20260916 --cases 8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-report-smoke
          path: reports/
          retention-days: 14
